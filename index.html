<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies</title>
    <!-- this is for icon in the title of page  -->
    <link rel="icon" href="photos/m-letter-logo-icon-for-business-and-company-vector.ico" type="image/icon type">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Swiper's CSS -->
    <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css" />

    <!-- Your custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Loading Screen -->
    <div id="loader" class="loader-wrapper">
        <div class="spinner"></div>
    </div>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-brand">
            <div class="logo" id="home-logo">
                <i class="fa-solid fa-film"></i>
                <span>Top Cinema</span>
            </div>
            <button id="theme-toggle-btn" class="nav-btn">
                <i class="fa-solid fa-sun"></i>
            </button>
        </div>
        <div class="nav-actions">
            <div class="search-container">
                <i class="fa-solid fa-search"></i>
                <input type="text" id="search-input" placeholder="Search movies...">
            </div>
            <button id="watchlist-btn" class="nav-btn">
                <i class="fa-solid fa-heart"></i> Watchlist
            </button>
        </div>
    </nav>

     <div class="container" id="main-content"> <!-- Start container-->
        <div class="swiper-container" id="hero-swiper"> <!-- Start swiper-container-->
            <div class="swiper-wrapper">  <!-- Start swiper-wrapper-->
                <div class="swiper-slide"><img src="photos/biker-384921_1280.jpg"></div>
                <div class="swiper-slide"><img src="photos/action1.jpg"></div>
                <div class="swiper-slide"><img src="photos/john-wick-2017-image-3840x2400.jpg"></div>
                <div class="swiper-slide"><img src="photos/458516317_3775532412715464_5847772832951079281_n.jpg"></div>
                <div class="swiper-slide"><img src="photos/458985716_3778563655745673_8306485135215768571_n.jpg"></div>
                <div class="swiper-slide"><img src="photos/xxx.jpg"></div>
                <div class="swiper-slide"><img src="photos/ai-generated-8172236_1280.png"></div>
                <div class="swiper-slide"><img src="photos/459385112_3783646711904034_8408406298165165415_n.jpg"></div>
                <div class="swiper-slide"><img src="photos/MV5BZTkyMmFiODQtMjc5YS00MzE2LTg4ZDctOTI5MTg5ZTQzZDM2XkEyXkFqcGc_._V1_.jpg"></div>
                <div class="swiper-slide"><img src="photos/motocross-4948269_1280.jpg"></div>
            </div> <!--End swiper-wrapper -->
            <!-- Add Pagination -->
            <div class="swiper-pagination"></div>

            <!-- Add Navigation -->
            <div class="swiper-button-next"></div>
            <div class="swiper-button-prev"></div>
            
            <!-- Hero Overlay Text -->
            <div class="hero-overlay-text">
                <h1>Top Cinema</h1>
                <p>Discover the best movies tailored for you.</p>
            </div>
        </div> <!-- End  swiper-container-->

        <!-- Dynamic Movies Container (Categorized rows) -->
        <div id="movies-container"></div>

        <!-- Search Results Container (Hidden by default) -->
        <div id="search-results-container" style="display: none;">
            <div class="section-title">
                <h2>Search Results</h2>
            </div>
            <div class="cards">
                <div class="aflam" id="search-grid"></div>
            </div>
        </div>

        <!-- Watchlist Container (Hidden by default) -->
        <div id="watchlist-container" style="display: none;">
            <div class="section-title">
                <h2>My Watchlist</h2>
            </div>
            <div class="cards">
                <div class="aflam" id="watchlist-grid"></div>
            </div>
        </div>
      
        <footer class="end">
            <p>جميع الحقوق محفوظة في الموقع &copy; 2024</p>
        </footer>
    </div>  <!--End container-->

    <!-- Movie Details Modal -->
    <div id="movie-modal" class="modal-overlay">
        <div class="modal-content">
            <button class="close-modal" id="close-modal-btn"><i class="fa-solid fa-times"></i></button>
            <div class="modal-body">
                <div class="modal-poster">
                    <img id="modal-img" src="" alt="Movie Poster">
                </div>
                <div class="modal-info">
                    <h2 id="modal-title">Title</h2>
                    <span id="modal-category" class="category-badge">Category</span>
                    <p id="modal-desc" class="description">Description</p>
                    <div class="modal-actions">
                        <button id="modal-watch-btn" class="primary-btn"><i class="fa-solid fa-play"></i> Watch Now</button>
                        <button id="modal-fav-btn" class="secondary-btn"><i class="fa-regular fa-heart"></i> Add to Watchlist</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scroll to Top Button -->
    <button id="scroll-top-btn" class="scroll-top">
        <i class="fa-solid fa-arrow-up"></i>
    </button>

    <!-- Swiper's JS -->
    <script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>
    <!-- Your custom JS -->
    <script src="main.js"></script>

</body>
</html>
